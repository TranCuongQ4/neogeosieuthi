<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tay Cầm PRO Trần Cường - Siêu Nhạy</title>
<style>
* { 
    box-sizing: border-box; 
    user-select: none; 
    -webkit-user-select: none; 
    touch-action: none;
}
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #14171c; font-family: 'Segoe UI', Arial, sans-serif; }
body { display: flex; flex-direction: column; justify-content: space-between; padding: 8px 16px; position: relative; }

.header-status { width: 100%; display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 13px; height: 35px; border-bottom: 1px solid #22272e; }
.status-dot { display: inline-block; width: 10px; height: 10px; background: #ff3366; border-radius: 50%; margin-right: 5px; }
.connected .status-dot { background: #00ffcc; box-shadow: 0 0 8px #00ffcc; }

.shoulder-area { display: flex; justify-content: space-between; width: 100%; padding: 0 10px; }
.shoulder-btn { 
    width: 110px; 
    height: 40px; 
    background: linear-gradient(180deg, #3a4454, #242b35); 
    border: 1px solid #4e5a6f; 
    color: #fff; 
    font-weight: bold; 
    font-size: 16px;
    border-radius: 20px 20px 8px 8px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    box-shadow: 0 5px 0px #161a20, 0 6px 10px rgba(0,0,0,0.6);
    transition: all 0.05s ease;
    touch-action: manipulation;
}
.shoulder-btn:active, .shoulder-btn.active { 
    transform: translateY(4px);
    box-shadow: 0 1px 0px #161a20, 0 2px 4px rgba(0,0,0,0.4);
    background: linear-gradient(180deg, #00ffcc, #00ccaa);
    color: #000;
}

.gamepad-area { display: flex; justify-content: space-between; align-items: center; flex-grow: 1; width: 100%; margin-top: 10px; }

.joystick-container {
    position: relative;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle, #1a1f26 40%, #0d1117 100%);
    border: 4px solid #2d3540;
    border-radius: 50%;
    box-shadow: inset 0 6px 12px rgba(0,0,0,0.8), 0 4px 8px rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
}
.joystick-knob {
    position: absolute;
    width: 76px;
    height: 76px;
    background: radial-gradient(circle, #485566 0%, #29323d 80%,
